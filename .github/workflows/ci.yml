name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend-lint:
    name: Backend lint & types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Ruff format check
        run: ruff format --check app || true
      - name: Mypy
        run: mypy app --ignore-missing-imports --no-strict-optional || true

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finops
          POSTGRES_PASSWORD: finops
          POSTGRES_DB: finops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ".[dev]"
      - name: Unit and integration tests
        run: pytest -q --cov=app --cov-report=xml --cov-report=term-missing
      - name: Verify migrations apply to PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://finops:finops@localhost:5432/finops_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint || true
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r <(pip install --dry-run --report - ./backend 2>/dev/null || echo "") || true
        continue-on-error: true

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: backend
            image: agent-api
          - context: frontend
            image: agent-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint chart
        run: helm lint infra/helm/finops --set externalSecrets.enabled=false
      - name: Render templates
        run: helm template finops infra/helm/finops --set externalSecrets.enabled=false > /dev/null
      - uses: azure/setup-kubectl@v4
      - name: Validate raw manifests
        run: |
          for file in infra/k8s/*.yaml; do
            kubectl apply --dry-run=client --validate=false -f "$file" > /dev/null || exit 1
          done

  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    needs: [backend-test]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ".[dev]"
      - name: Boot the API and exercise the platform
        run: |
          python -m app.cli init-db
          python -m app.cli seed-banking --customers 6
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8000/health/live && break
            sleep 2
          done
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@finops.local","password":"ChangeMe!2026"}' \
            | python -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          for path in dashboard/overview agents tools services costs/summary approvals; do
            curl -fsS -H "Authorization: Bearer $TOKEN" \
              "http://127.0.0.1:8000/api/v1/$path" > /dev/null
          done
          curl -fsS -H "Authorization: Bearer $TOKEN" -X POST \
            -H 'Content-Type: application/json' \
            -d '{"arguments":{"days":90,"persist_alerts":false}}' \
            http://127.0.0.1:8000/api/v1/tools/monitor_transactions/invoke > /dev/null
          curl -fsS -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:8000/api/v1/validation/scenarios \
            | python -c 'import sys,json; d=json.load(sys.stdin); assert d["total"]==20, d["total"]'
          echo "smoke suite passed"

      - name: Conformance suite (self-preparing; BLOCKED without a provider key)
        run: |
          python -m app.cli validate --quiet --output conformance.md
        env:
          ENVIRONMENT: local
          LOG_JSON: "false"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: backend/conformance.md
        env:
          ENVIRONMENT: local
          LOG_JSON: "false"
