[project]
name = "finops-command-center"
version = "1.0.0"
description = "Enterprise AI Agent Command Center for Financial Services"
# Upper bound set by NeMo Guardrails, which declares `>=3.10,<3.14` on every release
# through 0.23.0. Without the cap, pip happily starts an install on 3.14 and fails several
# minutes later with a resolver error that never names the offending package. The rails are
# not optional in practice: the engine refuses to run an agent that declares them when the
# package is absent, and every implemented agent declares them. Raise this the moment NeMo
# ships a release that supports a newer interpreter.
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.0",
    "httpx>=0.27.2",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.12",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "tenacity>=9.0.0",
    "orjson>=3.10.0",
    "sse-starlette>=2.1.3",
    "websockets>=13.1",
    "numpy>=2.1.0",
    "python-dateutil>=2.9.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
vector = ["qdrant-client>=1.12.0", "pgvector>=0.3.6"]
streams = ["aiokafka>=0.11.0"]
storage = ["minio>=7.2.10"]
graph = ["neo4j>=5.26.0"]
search = ["elasticsearch>=8.15.0"]
ocr = ["pytesseract>=0.3.13", "pillow>=11.0.0", "pypdfium2>=4.30.0"]
oidc = ["authlib>=1.3.2"]
vault = ["hvac>=2.3.0"]
# NeMo Guardrails. Required by any deployment that runs an agent with a rail
# configuration under app/guardrails/configs/ — the engine refuses such a run rather than
# executing it unguarded. Set NEMO_GUARDRAILS_ENABLED=false to run without rails.
guardrails = ["nemoguardrails>=0.23.0"]
dev = [
    "nemoguardrails>=0.23.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-python-dateutil",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501", "ASYNC109", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = []
