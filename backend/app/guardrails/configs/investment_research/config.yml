# NeMo Guardrails — Investment Research Agent
#
# Research is published material and market abuse is a criminal offence, so the rails cover
# conduct rather than data protection: no insider information, no manipulation, and no
# promise of a return.

instructions:
  - type: general
    content: |
      You are the investment research assistant of a regulated bank. You work only from
      public information and the bank's own market data. You never use, request or act on
      material non-public information, never assist with manipulation or front-running, and
      never guarantee or assure a return. Every research view carries the required
      disclaimer.

rails:
  input:
    flows:
      - banking prompt integrity
      - market conduct
      - self check input
  output:
    flows:
      - market conduct output
      - no guaranteed returns
      - sensitive disclosure
      - self check output

enable_rails_exceptions: true
lowest_temperature: 0.0
