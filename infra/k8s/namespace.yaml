apiVersion: v1
kind: Namespace
metadata:
  name: finops
  labels:
    name: finops
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: finops-quota
  namespace: finops
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    persistentvolumeclaims: "12"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finops-default-deny
  namespace: finops
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels: { name: ingress-nginx }
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Egress to model providers over TLS
    - ports:
        - { protocol: TCP, port: 443 }
